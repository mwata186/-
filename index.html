<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>営業日トラッカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <button class="nav-btn" id="prevBtn" aria-label="前月">&#8249;</button>
      <h1 class="month-title" id="monthTitle"></h1>
      <button class="nav-btn" id="nextBtn" aria-label="翌月">&#8250;</button>
    </header>

    <section class="stats-section">
      <div class="stat-card">
        <div class="stat-label">今日の営業日</div>
        <div class="stat-value" id="currentBizDay">-</div>
        <div class="stat-unit" id="currentBizDayUnit">営業日目</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">月の全営業日</div>
        <div class="stat-value" id="totalBizDays">-</div>
        <div class="stat-unit">営業日</div>
      </div>
    </section>

    <section class="progress-section">
      <div class="progress-header">
        <span class="progress-label">月の進捗率</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="progress-detail" id="progressDetail"></div>
    </section>

    <section class="calendar-section">
      <div class="calendar-weekdays">
        <div class="weekday">月</div>
        <div class="weekday">火</div>
        <div class="weekday">水</div>
        <div class="weekday">木</div>
        <div class="weekday">金</div>
        <div class="weekday sat">土</div>
        <div class="weekday sun">日</div>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="legend">
        <span class="legend-item"><span class="dot today-dot"></span>今日</span>
        <span class="legend-item"><span class="dot bizday-dot"></span>営業日</span>
        <span class="legend-item"><span class="dot sat-dot"></span>土曜</span>
        <span class="legend-item"><span class="dot holiday-dot"></span>日・祝</span>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
